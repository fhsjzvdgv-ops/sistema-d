<title>Система</title>

<style>
:root{
  --bg:#0d0a24;--card:#17123a;--card2:#1f1850;--line:#2c2466;
  --ink:#f2f0ff;--ink2:#a9a3d6;--acc:#7b63ff;
  --xp:#04f17e;--warn:#ffb547;--bad:#ff5a7a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;padding:0 16px 96px;max-width:560px;margin:0 auto}
h1{font-size:22px;font-weight:800}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:22px 0 10px;font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:5}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.rank{font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--acc);flex:none}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--xp));border-radius:99px;transition:width .4s}
.small{font-size:12px;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card.warn{border-color:var(--warn)}
.card.bad{border-color:var(--bad);background:#2a1030}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.path{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.path b{font-size:18px}
.deed{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.deed .chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:800}
.deed.done{opacity:.55}
.deed.done .chk{background:var(--xp);border-color:var(--xp);color:#0d0a24}
.deed .t{font-weight:600}
.xp{font-weight:800;color:var(--xp);font-size:13px;flex:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.q summary{list-style:none;padding:14px;cursor:pointer}
.q summary::-webkit-details-marker{display:none}
.q .steps{padding:0 14px 14px}
.q.lock{opacity:.5}
.step{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.step .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:800}
.step.done .chk{background:var(--xp);border-color:var(--xp);color:#0d0a24}
.step.done .t{text-decoration:line-through;color:var(--ink2)}
.step.next{background:var(--card2);margin:0 -14px;padding:9px 14px}
.first{font-size:12px;color:var(--warn);margin-top:2px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--ink2);flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0d0a24f2;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:9}
.nav button{flex:1;max-width:140px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--ink2);font-weight:600}
.nav button span{display:block;font-size:20px}
.nav button.on{background:var(--card2);color:var(--ink)}
.btn{background:var(--acc);border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn.ghost{background:var(--card2)}
.btn.warn{background:var(--warn);color:#0d0a24}
input,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.disc{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.disc input{padding:6px;text-align:center}
.disc .me{text-align:center;font-weight:800}
.win{color:var(--xp)}
.score{font-size:30px;font-weight:800;text-align:center}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-140%);background:var(--acc);padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;z-index:30}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet p{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fut{border-radius:14px;padding:12px}
.fut ul{padding-left:18px;margin-top:6px}
.hidden{display:none}
.nav button{max-width:110px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.kcard.unread{border-color:var(--acc)}
.kcard .fy{margin-top:6px;font-size:13px;color:var(--warn)}
.kcard summary{cursor:pointer;color:var(--acc);font-size:13px;margin-top:6px}
.les{padding-left:18px;margin:8px 0}
.les li{margin-bottom:6px}
.stg{display:flex;gap:6px;margin:8px 0}
.stg i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.stg i.on{background:var(--xp)}
.inb{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 4px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--acc);color:#fff}
.skrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sk{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:600;text-align:left}
.sk.lock{opacity:.4}
.sk.act{border-color:var(--warn);background:#3a2a10}
.sk.full{border-color:var(--xp)}
.sk small{display:block;font-size:10px;color:var(--ink2);font-weight:400}
.chap{border-left:3px solid var(--acc);padding:4px 0 4px 10px;margin:10px 0}
.inb button{width:32px;height:32px;border-radius:9px;background:var(--card2);flex:none}
</style>
</head>

    {t:'Купить одну вещь в новом стиле',first:'Найди 3 образа на Pinterest и возьми одну вещь оттуда.',xp:50},
    {t:'Собрать образ целиком и сфоткаться',first:'Покажи Эдуарду.',xp:40}]},
  {id:'love',p:'brave',lock:5,t:'Девушки',steps:[
    {t:'Найти, где знакомиться: тусовки, музыкальные чаты, учёба, приложение',first:'Выпиши 3 места.',xp:30},
    {t:'Начать переписку с одной девушкой',first:'Вопрос про неё, а не «привет, как дела».',xp:40},

    {t:'Второе свидание',first:'',xp:100}]}
];
const PRAISE=['Красава!','Вот это темп!','Эдуард нервно курит в сторонке','Так держать, машина','Минус лень, плюс опыт','Ещё один кирпич в стену','Прошлый ты такого не делал','Шапочка выходит на охоту','Растёшь на глазах','Чемпионский ход'];
const RANKS=[[1,'E'],[5,'D'],[10,'C'],[15,'B'],[20,'A'],[30,'S']];
const PUNISH_DEF='Пицца за счёт проигравшего\n50 отжиманий при победителе\nЗадание от победителя\nКальян за счёт проигравшего\nПроигравший убирает после посиделок\nНеделю называть победителя «босс»';
const PENALTY=30;

// ================= СОСТОЯНИЕ =================
const KEY='sistema_dariy_v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={log:[],qs:{},howto:false,bestStreak:0};
S=Object.assign({name:'Красная Шапочка',cls:'Битмейкер',goal:'К 9 ноября: военкомат закрыт · 2 трека готовы · вышел на работу · хожу в зал',
  rv:{name:'Эдуард',xp:'',streak:'',test:'',brave:''},punish:PUNISH_DEF,tests:[],weights:[],debt:0,lastChk:'',
  cdone:{},read:[],libStart:'',inbox:[],reviews:{},tired:0,sk:{},qtab:'q'},S);
if(!S.libStart){S.libStart=new Date().toISOString().slice(0,10)}
if(S.rival){S.rv.name=S.rival.name||S.rv.name;S.rv.xp=S.rival.xp||'';delete S.rival}
if(S.name==='Дарий')S.name='Красная Шапочка';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dk(new Date());
const addD=(k,n)=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return dk(d)};
function weekStart(d=new Date()){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return dk(x)}
const sum=a=>a.reduce((s,e)=>s+e.xp,0);
const good=()=>S.log.filter(e=>e.xp>0);
const totalXP=()=>Math.max(0,sum(S.log));
const pathXP=p=>Math.max(0,sum(S.log.filter(e=>e.p===p)));
const weekXP=()=>{const w=weekStart();return sum(S.log.filter(e=>e.d>=w))};
const braveWeek=()=>{const w=weekStart();return good().filter(e=>e.d>=w&&e.p==='brave').length};
const lvlOf=xp=>{let n=1;while(50*(n+1)*n<=xp)n++;return n}; // уровень n = 50·n·(n−1) опыта
const lvlFloor=n=>50*n*(n-1);
const rankOf=l=>{let r='E';for(const [m,x] of RANKS)if(l>=m)r=x;return r};
const level=()=>lvlOf(totalXP());
function streak(){
  const days=new Set(good().map(e=>e.d));let k=today(),n=0;
  if(!days.has(k))k=addD(k,-1);
  while(days.has(k)){n++;k=addD(k,-1)}
  return n;
}
const doneToday=id=>S.log.some(e=>e.d===today()&&e.id===id);
const qStep=(q,i)=>(S.qs[q]||[]).includes(i);

// штраф за пропущенный день: −30 XP и 30 отжиманий в долг
function checkMissed(){
  const g=good();if(!g.length)return;
  const first=g.map(e=>e.d).sort()[0];
  let k=S.lastChk?addD(S.lastChk,1):first;const y=addD(today(),-1);
  const days=new Set(g.map(e=>e.d));let n=0;
  while(k<=y){if(!days.has(k)){S.log.push({d:k,id:'pen',p:'head',xp:-PENALTY,t:'Пропуск дня'});S.debt+=PENALTY;n++}k=addD(k,1)}
  S.lastChk=y;save();
  if(n)setTimeout(()=>sheet(`<h1 style="color:var(--bad)">Пропуск: ${n} дн.</h1><p style="margin:8px 0">−${n*PENALTY} XP и ${n*PENALTY} отжиманий в долг. Пока долг висит, опыт идёт в половину.</p>${futureHtml()}<button class="btn warn" style="margin-top:12px" onclick="closeSheet()">Понял, отрабатываю</button>`),300);
}

// ================= КУРС И ЗНАНИЯ =================
const CARD={};BASE.cards.forEach(c=>CARD[c.id]=c);
const tDone=m=>(S.cdone[m.id]||[]).length>=m.tasks.length;
const curTheme=()=>BASE.course.find(m=>!tDone(m));
function unlockedCards(){
  const set=new Set(BASE.cards.filter(c=>c.id.startsWith('g.')).map(c=>c.id));
  const cur=curTheme();
  for(const m of BASE.course){m.cards.forEach(i=>set.add(i));if(m===cur)break}
  // свиток дня: каждый день +1 карточка из остальной базы
  const days=Math.floor((new Date(today()+'T12:00')-new Date(S.libStart+'T12:00'))/864e5)+1;
  const order=[...BASE.course.flatMap(m=>m.cards),...BASE.cards.map(c=>c.id)];
  let n=days;for(const i of order){if(n<=0)break;if(!set.has(i)){set.add(i);n--}}
  return set;
}
function dailyCard(){const u=unlockedCards();return BASE.cards.find(c=>u.has(c.id)&&!S.read.includes(c.id))}
function readCard(id){if(S.read.includes(id))return;S.read.push(id);award({d:today(),id:'read:'+id,p:'head',xp:5,t:'Знание: '+CARD[id].t});render()}
function toggleTask(mid,i){
  const m=BASE.course.find(x=>x.id===mid),arr=S.cdone[mid]=S.cdone[mid]||[],key=`c:${mid}:${i}`;
  if(arr.includes(i)){arr.splice(arr.indexOf(i),1);unaward(e=>e.id===key);unaward(e=>e.id==='cdone:'+mid)}
  else{arr.push(i);award({d:today(),id:key,p:m.p,xp:40,t:m.tasks[i].t});
    if(arr.length===m.tasks.length){S.log.push({d:today(),id:'cdone:'+mid,p:m.p,xp:100,t:'Тема: '+m.t});save();const nx=curTheme();
      setTimeout(()=>sheet(`<h1>Тема пройдена!</h1><p style="margin:8px 0">${esc(m.t)} · <b class="win">+100 XP</b></p>${nx?`<p>Открылась новая тема: <b>${esc(nx.t)}</b> и ${nx.cards.length} карточек знаний.</p>`:'<p>Курс пройден целиком. Легенда.</p>'}<button class="btn" onclick="closeSheet()">Дальше</button>`),500)}}
  save();render();
}
function cardHtml(c,u){
  if(!u)return '';
  const unread=!S.read.includes(c.id);
  return `<div class="kcard ${unread?'unread':''}"><div class="row"><b class="sp">${esc(c.t)}</b>${unread?`<button class="tag" style="background:var(--acc);color:#fff" onclick="readCard('${c.id}')">Прочитал +5</button>`:'<span class="tag">✓</span>'}</div>
    <div style="margin-top:6px">${esc(c.x)}</div>${c.a?`<details><summary>Показать ответ</summary><div class="small" style="margin-top:4px">${esc(c.a)}</div></details>`:''}${c.fy?`<div class="fy">▶ Для тебя: ${esc(c.fy)}</div>`:''}</div>`;
}
function themeHtml(m,full){
  const arr=S.cdone[m.id]||[],idx=BASE.course.indexOf(m)+1,u=unlockedCards();
  return `<div class="card"><div class="small">КУРС · СТУПЕНЬ ${m.st} «${esc(BASE.stages[m.st-1].t)}» · ТЕМА ${idx} ИЗ ${BASE.course.length}</div>
  <h1 style="font-size:19px;margin-top:4px">${esc(m.t)}</h1><p class="small" style="margin-top:6px">${esc(m.why)}</p>
  ${full?`<ul class="les">${m.les.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
  ${m.tasks.map((t,i)=>{const on=arr.includes(i);return `<button class="step ${on?'done':''}" onclick="toggleTask('${m.id}',${i})"><div class="chk">${on?'✓':''}</div><div class="sp"><div class="t">${esc(t.t)}</div>${on?'':`<div class="first">▶ ${esc(t.how)}</div>`}</div><div class="xp">+40</div></button>`}).join('')}
  ${full?'':`<button class="btn ghost" style="margin-top:10px" onclick="cur='learn';render();scrollTo(0,0)">Урок и карточки темы →</button>`}</div>
  ${full?`<h2>Карточки темы · ${m.cards.filter(i=>S.read.includes(i)).length}/${m.cards.length}</h2>`+m.cards.map(i=>cardHtml(CARD[i],u.has(i))).join(''):''}`;
}
function vLearn(){
  const m=curTheme(),u=unlockedCards();
  let h=m?`<h2>Текущая тема</h2>`+themeHtml(m,true):'<div class="card"><h1>Курс пройден!</h1></div>';
  h+=`<h2>Путь курса</h2><div class="card">`+BASE.stages.map((st,si)=>{const ms=BASE.course.filter(x=>x.st===si+1);return `<div style="margin-bottom:10px"><b>${si+1}. ${esc(st.t)}</b> <span class="small">${esc(st.why)}</span><div class="stg">${ms.map(x=>`<i class="${tDone(x)?'on':''}" title="${esc(x.t)}"></i>`).join('')}</div><div class="small">${ms.map(x=>(tDone(x)?'✓ ':x===m?'▶ ':'🔒 ')+esc(x.t)).join(' · ')}</div></div>`}).join('')+`<div class="small">🔒 Ступень 5 «Девушки» — с ранга D.</div></div>`;
  h+=`<h2>Библиотека · открыто ${u.size} из ${BASE.cards.length} · прочитано ${S.read.length}</h2><p class="small" style="margin-bottom:8px">Каждый день открывается одна новая карточка, остальные — вместе с темами курса.</p>`;
  for(const g of BASE.groups){const cs=BASE.cards.filter(c=>c.g===g),op=cs.filter(c=>u.has(c.id));
    h+=`<details class="q"><summary><div class="row"><b class="sp">${esc(g)}</b><span class="tag">${op.length}/${cs.length}</span></div></summary><div class="steps">${op.length?op.map(c=>cardHtml(c,1)).join(''):'<p class="small">Пока закрыто.</p>'}</div></details>`}
  return h;
}
// ================= НАВЫКИ =================
const SK={},SKG={};SKILLS.forEach(g=>g.skills.forEach(s=>{SK[s.id]=s;SKG[s.id]=g}));
const RORD='EDCBAS';
const rankOK=r=>!r||RORD.indexOf(rankOf(level()))>=RORD.indexOf(r);
const skS=id=>S.sk[id]=S.sk[id]||{tier:0,active:false,days:[],steps:[]};
const mastered=(id,n)=>(S.sk[id]?.tier||0)>=n;
function skOpen(id){
  const s=SK[id],g=SKG[id];if(!rankOK(s.lock))return false;
  const ps=g.parents[id];return !ps||!ps.length||ps.some(p=>mastered(p,1));
}
function tierOK(id){const s=SK[id],t=s.tiers[skS(id).tier];if(!t)return true;if(!rankOK(t.rank))return false;if(t.after&&!mastered(t.after[0],t.after[1]))return false;return true}
const activeN=()=>Object.values(S.sk).filter(x=>x.active).length;
const ROM=['I','II','III'];
function skChip(id){
  const s=SK[id],st=S.sk[id]||{tier:0},op=skOpen(id),full=st.tier>=s.tiers.length;
  return `<button class="sk ${!op?'lock':''} ${st.active?'act':''} ${full?'full':''}" onclick="skillSheet('${id}')">${!op?'🔒 ':st.active?'▶ ':full?'★ ':''}${esc(s.name)}<small>${full?'освоен':'ступень '+ROM[Math.min(st.tier,2)]+' · '+st.tier+'/3'}</small></button>`;
}
function vSkills(){
  let h=`<div class="card small">Бери в работу до 3 навыков. Ступень-привычка осваивается за 21 день практики (не обязательно подряд), ступень-квест — делом. Освоил ступень I — открываются соседние навыки. В работе: <b>${activeN()}/3</b>.</div>`;
  for(const g of SKILLS){
    h+=`<h2><span class="dot" style="background:${PATHS[g.p].c}"></span>${esc(g.name)} · ${esc(g.short)}</h2>`;
    h+=g.rows.map(r=>`<div class="skrow">${r.map(skChip).join('')}</div>`).join('');
  }
  return h;
}
function skillSheet(id){
  const s=SK[id],g=SKG[id],st=skS(id),op=skOpen(id),t=s.tiers[st.tier],full=!t,tok=tierOK(id),today_=today();
  let h=`<div class="small">${esc(g.name)}</div><h1>${esc(s.name)}</h1><p style="margin:6px 0">${esc(s.desc)}</p>${s.fy?`<p class="first">▶ Для тебя: ${esc(s.fy)}</p>`:''}`;
  h+=`<div class="row" style="margin:10px 0;flex-wrap:wrap">${s.tiers.map((x,i)=>`<span class="tag" style="${i<st.tier?'background:var(--xp);color:#0d0a24':i===st.tier?'background:var(--acc);color:#fff':''}">${ROM[i]} ${esc(x.title)}</span>`).join('')}</div>`;
  if(!op){const ps=(g.parents[id]||[]).map(p=>SK[p].name);h+=`<div class="card warn">🔒 ${s.lock&&!rankOK(s.lock)?`Откроется с ранга ${s.lock}.`:`Откроется, когда освоишь ступень I у навыка: ${ps.map(esc).join(' или ')}.`}</div>`}
  else if(full)h+=`<div class="card" style="border-color:var(--xp)">★ Навык освоен полностью.</div>`;
  else{
    h+=`<h2>Ступень ${ROM[st.tier]}: ${esc(t.title)}</h2>`;
    if(!tok)h+=`<div class="card warn">🔒 ${t.rank&&!rankOK(t.rank)?`Ступень откроется с ранга ${t.rank}.`:`Сначала: ${esc(SK[t.after[0]].name)}, ступень ${ROM[t.after[1]-1]}.`}</div>`;
    if(t.how)h+=`<p>${esc(t.how)}</p>`;
    if(t.daily&&t.mode==='days')h+=`<p class="first">Каждый день: ${esc(t.daily)}</p>`;
    (t.chapter||[]).forEach(c=>{h+=`<div class="chap"><b>${esc(c.title||'')}</b><div class="small" style="color:var(--ink)">${esc(c.text||'')}</div>${c.practice?`<div class="first">Практика: ${esc(c.practice)}</div>`:''}${c.check?`<div class="small">Проверка: ${esc(c.check)}</div>`:''}</div>`});
    if(t.watch)h+=`<p class="small">Следить: ${t.watch.map(esc).join(' · ')}</p>`;
    if(st.active&&tok){
      if(t.mode==='days'){const n=st.days.length,on=st.days.includes(today_);
        h+=`<div class="bar"><i style="width:${Math.round(n/t.days*100)}%"></i></div><p class="small" style="margin:4px 0 10px">${n} из ${t.days} дней практики</p>
        <button class="btn ${on?'ghost':''}" onclick="skDay('${id}')">${on?'✓ Сегодня засчитано (отменить)':'Практиковал сегодня · +10 XP'}</button>`}
      else if(t.mode==='steps'){h+=t.steps.map((x,i)=>{const on=st.steps.includes(i);return `<button class="step ${on?'done':''}" onclick="skStep('${id}',${i})"><div class="chk">${on?'✓':''}</div><div class="sp t">${esc(x)}</div><div class="xp">+20</div></button>`}).join('')}
      else h+=`<button class="btn" onclick="skOnce('${id}')">Сделал · освоить ступень</button>`;
    }
  }
  if(op&&!full)h+=`<div style="margin-top:14px">${st.active?`<button class="btn ghost" onclick="skToggle('${id}')">Снять с работы</button>`:`<button class="btn" onclick="skToggle('${id}')">Взять в работу${activeN()>=3?' (уже 3 — сначала сними один)':''}</button>`}</div>`;
  if(s.why)h+=`<details style="margin-top:12px"><summary class="small">Зачем этот навык</summary><p class="small" style="margin-top:6px">${esc(s.why)}</p></details>`;
  h+=`<button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">Закрыть</button>`;
  sheet(h);
}
function skToggle(id){const st=skS(id);if(!st.active&&activeN()>=3)return toast('В работе уже 3 навыка');st.active=!st.active;save();skillSheet(id);render()}
function skMaster(id){
  const s=SK[id],st=skS(id),g=SKG[id],t=s.tiers[st.tier];
  st.tier++;st.days=[];st.steps=[];if(st.tier>=s.tiers.length)st.active=false;
  S.log.push({d:today(),id:`skm:${id}:${st.tier}`,p:g.p,xp:100,t:`Навык ${s.name}: ступень ${ROM[st.tier-1]}`});save();
  const opened=st.tier===1?SKILLS.flatMap(x=>x.skills).filter(x=>(SKG[x.id].parents[x.id]||[]).includes(id)).map(x=>x.name):[];
  sheet(`<h1>Ступень ${ROM[st.tier-1]} освоена!</h1><p style="margin:8px 0">${esc(s.name)} · <b class="win">+100 XP</b></p>${opened.length?`<p>Открылись навыки: <b>${opened.map(esc).join(', ')}</b></p>`:''}<button class="btn" onclick="skillSheet('${id}')">Дальше</button>`);
  render();
}
function skDay(id){
  const st=skS(id),t=SK[id].tiers[st.tier],k=today(),key=`skd:${id}:${k}`;
  if(st.days.includes(k)){st.days.splice(st.days.indexOf(k),1);unaward(e=>e.id===key);save();if(document.getElementById('modal').classList.contains('show'))skillSheet(id);render();return}
  st.days.push(k);award({d:k,id:key,p:SKG[id].p,xp:10,t:SK[id].name});
  if(st.days.length>=t.days)return skMaster(id);
  save();if(document.getElementById('modal').classList.contains('show'))skillSheet(id);render();
}
function skStep(id,i){
  const st=skS(id),t=SK[id].tiers[st.tier],key=`sks:${id}:${st.tier}:${i}`;
  if(st.steps.includes(i)){st.steps.splice(st.steps.indexOf(i),1);unaward(e=>e.id===key)}
  else{st.steps.push(i);award({d:today(),id:key,p:SKG[id].p,xp:20,t:t.steps[i]});if(st.steps.length>=t.steps.length)return skMaster(id)}
  save();skillSheet(id);render();
}
function skOnce(id){skMaster(id)}
function skTodayHtml(){
  const act=Object.keys(S.sk).filter(id=>S.sk[id].active&&SK[id]);
  if(!act.length)return `<h2>Навыки</h2><div class="card small">Пока ни одного навыка в работе. Открой «Квесты → Навыки» и возьми 1–3.</div>`;
  return `<h2>Навыки в работе · ${act.length}/3</h2>`+act.map(id=>{const s=SK[id],st=S.sk[id],t=s.tiers[st.tier];if(!t)return '';
    const on=t.mode==='days'&&st.days.includes(today());
    const sub=t.mode==='days'?`${esc(t.daily||t.title)} · ${st.days.length}/${t.days}`:t.mode==='steps'?`Дальше: ${esc(t.steps[t.steps.findIndex((x,i)=>!st.steps.includes(i))]||'')}`:esc(t.title);
    return `<button class="deed ${on?'done':''}" onclick="${t.mode==='days'&&tierOK(id)?`skDay('${id}')`:`skillSheet('${id}')`}"><div class="chk">${on?'✓':t.mode==='days'?'':'▶'}</div><div class="sp"><div class="t"><span class="dot" style="background:${PATHS[SKG[id].p].c}"></span>${esc(s.name)} · ${ROM[st.tier]}</div><div class="small">${sub}</div></div><div class="xp">${t.mode==='days'?'+10':''}</div></button>`}).join('');
}

function inboxDel(i){S.inbox.splice(i,1);save();render()}
function inboxHtml(){

const secs=v=>{if(!v)return 0;const p=String(v).split(':');return p.length>1?(+p[0])*60+(+p[1]):+v};
function testGrowth(){
  if(S.tests.length<2)return 0;
  const a=S.tests[0],b=S.tests[S.tests.length-1];const parts=[];
  if(a.push&&b.push)parts.push(b.push/a.push-1);
  if(a.plank&&b.plank)parts.push(secs(b.plank)/secs(a.plank)-1);
  if(a.run&&b.run)parts.push(secs(a.run)/secs(b.run)-1);
  return parts.length?Math.round(parts.reduce((s,x)=>s+x,0)/parts.length*100):0;
}
